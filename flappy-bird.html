<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Bird</title>
<style>
:root{
  --sky-top:#7ad0e8; --sky-bot:#d9f3e6; --pipe:#4aa84a; --pipe-edge:#2d7a33;
  --ground:#d8c27a; --ground-edge:#7a9a2e; --ink:#2b2b2b; --bg:#1d3b4a; --card:#fffbe8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1f28; --sky-top:#2a5d78; --sky-bot:#6fa7a0; --ground:#a38f52; --ground-edge:#5d7a24; }
}
:root[data-theme="dark"]{ --bg:#0f1f28; --sky-top:#2a5d78; --sky-bot:#6fa7a0; --ground:#a38f52; --ground-edge:#5d7a24; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
html,body{ margin:0; height:100%; }
body{
  background:var(--bg); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; touch-action:manipulation; overflow:hidden;
}
#wrap{ position:relative; height:min(100%,760px); aspect-ratio:2/3; max-width:100%; }
canvas{ width:100%; height:100%; display:block; border-radius:12px; cursor:pointer; }
.hint{ position:absolute; bottom:10px; left:0; right:0; text-align:center; color:#fff; font-size:13px; opacity:.8; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="600" aria-label="Flappy Bird game. Press space, click or tap to flap."></canvas>
  <div class="hint">Space / click / tap to flap</div>
</div>
<script>
(function(){
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 400, H = 600, GROUND = 70, GAP = 150, PIPE_W = 64, SPEED = 2.4, SPACING = 210;
  var GRAV = 0.42, FLAP = -7.2;
  var best = 0;
  try { best = parseInt(localStorage.getItem('flappy-best') || '0', 10) || 0; } catch(e){}

  var state, bird, pipes, score, frame, groundX, clouds = [];
  for (var i=0;i<4;i++) clouds.push({x:Math.random()*W, y:40+Math.random()*180, s:0.6+Math.random()*0.8});

  function reset(){
    bird = {x:100, y:H/2-30, vy:0, r:13};
    pipes = []; score = 0; frame = 0; groundX = 0;
    state = 'ready';
  }
  function flap(){
    if (state === 'ready'){ state = 'play'; }
    if (state === 'play'){ bird.vy = FLAP; }
    else if (state === 'over' && frame > 30){ reset(); }
  }
  // Difficulty ramps slowly: gap 150 -> 115 and spacing 210 -> 170 as score rises
  function curGap(){ return Math.max(115, GAP - score*1.5); }
  function curSpacing(){ return Math.max(170, SPACING - score*1.75); }
  function addPipe(x){
    var gap = curGap();
    var top = 70 + Math.random()*(H - GROUND - gap - 140);
    pipes.push({x:x, top:top, gap:gap, scored:false});
  }

  function die(){
    state = 'over'; frame = 0;
    if (score > best){
      best = score;
      try { localStorage.setItem('flappy-best', String(best)); } catch(e){}
    }
  }

  function update(){
    frame++;
    groundX = (groundX - SPEED) % 24;
    clouds.forEach(function(c){ c.x -= 0.2*c.s; if (c.x < -80) c.x = W + 40; });
    if (state === 'ready'){
      bird.y = H/2 - 30 + Math.sin(frame/8)*7;
      return;
    }
    if (state === 'over'){
      if (bird.y < H - GROUND - bird.r){ bird.vy += GRAV; bird.y += bird.vy; }
      return;
    }
    bird.vy += GRAV; bird.y += bird.vy;
    if (!pipes.length) addPipe(W + 60);
    var last = pipes[pipes.length-1];
    var sp = curSpacing();
    if (last.x < W - sp) addPipe(last.x + sp);
    pipes.forEach(function(p){
      p.x -= SPEED;
      if (!p.scored && p.x + PIPE_W < bird.x){ p.scored = true; score++; }
      var inX = bird.x + bird.r - 3 > p.x && bird.x - bird.r + 3 < p.x + PIPE_W;
      if (inX && (bird.y - bird.r + 3 < p.top || bird.y + bird.r - 3 > p.top + p.gap)) die();
    });
    pipes = pipes.filter(function(p){ return p.x > -PIPE_W - 10; });
    if (bird.y + bird.r >= H - GROUND){ bird.y = H - GROUND - bird.r; die(); }
    if (bird.y - bird.r < 0){ bird.y = bird.r; bird.vy = 0; }
  }

  function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function drawPipe(p){
    var pipe = css('--pipe'), edge = css('--pipe-edge');
    function seg(x,y,w,h,capY){
      ctx.fillStyle = pipe; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x+6,y,6,h);
      ctx.strokeStyle = edge; ctx.lineWidth = 3; ctx.strokeRect(x,y,w,h);
      ctx.fillStyle = pipe; ctx.fillRect(x-4,capY,w+8,24);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x+2,capY,6,24);
      ctx.strokeRect(x-4,capY,w+8,24);
    }
    seg(p.x, 0, PIPE_W, p.top, p.top-24);
    var by = p.top + p.gap;
    seg(p.x, by, PIPE_W, H - GROUND - by, by);
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    var rot = state === 'ready' ? 0 : Math.max(-0.5, Math.min(1.3, bird.vy/10));
    ctx.rotate(rot);
    ctx.fillStyle = '#f7c531'; ctx.beginPath(); ctx.ellipse(0,0,17,13,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2; ctx.stroke();
    var wing = state === 'over' ? 3 : Math.sin(frame/3)*5;
    ctx.fillStyle = '#f0a020'; ctx.beginPath(); ctx.ellipse(-5,3+wing*0.3,8,5,-0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7,-4,5,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(9,-4,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8573a'; ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(24,3); ctx.lineTo(13,7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function text(t, x, y, size, fill){
    ctx.font = 'bold ' + size + 'px "Trebuchet MS",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.lineWidth = size/6; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#2b2b2b'; ctx.strokeText(t,x,y);
    ctx.fillStyle = fill || '#fff'; ctx.fillText(t,x,y);
  }

  function draw(){
    var g = ctx.createLinearGradient(0,0,0,H-GROUND);
    g.addColorStop(0, css('--sky-top')); g.addColorStop(1, css('--sky-bot'));
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    clouds.forEach(function(c){
      ctx.beginPath();
      ctx.ellipse(c.x,c.y,34*c.s,14*c.s,0,0,Math.PI*2);
      ctx.ellipse(c.x+22*c.s,c.y+4*c.s,26*c.s,11*c.s,0,0,Math.PI*2);
      ctx.ellipse(c.x-20*c.s,c.y+5*c.s,24*c.s,10*c.s,0,0,Math.PI*2);
      ctx.fill();
    });
    pipes.forEach(drawPipe);
    ctx.fillStyle = css('--ground'); ctx.fillRect(0,H-GROUND,W,GROUND);
    ctx.fillStyle = css('--ground-edge'); ctx.fillRect(0,H-GROUND,W,12);
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (var x = groundX; x < W; x += 24){ ctx.fillRect(x, H-GROUND+12, 12, 6); }
    drawBird();

    if (state === 'ready'){
      text('Flappy Bird', W/2, 160, 46, '#fff');
      text('Tap to start', W/2, 300, 24, '#fff');
    } else if (state === 'play'){
      text(String(score), W/2, 80, 52, '#fff');
    } else {
      var a = Math.min(1, frame/15);
      ctx.globalAlpha = a;
      ctx.fillStyle = css('--card'); ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect(70, 160, 260, 230, 14); ctx.fill(); ctx.stroke();
      text('Game over', W/2, 212, 34, '#e8573a');
      ctx.font = 'bold 20px "Trebuchet MS",system-ui,sans-serif'; ctx.fillStyle = '#2b2b2b'; ctx.textAlign = 'center';
      ctx.fillText('Score  ' + score, W/2, 262);
      ctx.fillText('Best  ' + best, W/2, 296);
      ctx.font = '16px "Trebuchet MS",system-ui,sans-serif';
      ctx.fillText(frame > 30 ? 'Tap to play again' : '', W/2, 352);
      ctx.globalAlpha = 1;
    }
  }

  var last = 0, acc = 0, STEP = 1000/60;
  function loop(t){
    acc += Math.min(100, t - last); last = t;
    while (acc >= STEP){ update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); if(!e.repeat) flap(); }
  });
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); flap(); });

  reset();
  requestAnimationFrame(function(t){ last = t; loop(t); });
})();
</script>
</body>
</html>
